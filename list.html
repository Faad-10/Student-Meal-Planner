<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Food List</title>
  <link rel="stylesheet" href="list.css">

</head>
<body>
<nav>
        
        <div class="logo">
            <img src="restaurant.png" alt="logo">
            <h1>Student <br> Meal Planner</h1>
        </div>
         <ul class="nav-link">
             <li><a href="planner.html" class=>Home</a></li>
             <li><a href="list.html" class="active">Food List</a></li>
         </ul>
    </nav>
<section class="food-section">

  <div class="top-area">

    <h1>Top Affordable Foods</h1>

    <div class="top-buttons">

      <button id="openModalBtn">
        + Add Food
      </button>

      <button id="clearBtn">
        Clear All
      </button>

    </div>

  </div>

  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>Food Name</th>

          <th>Price</th>

          <th>Actions</th>

        </tr>

      </thead>

      <tbody id="foodTableBody">

      </tbody>

    </table>

  </div>

</section>

<div class="modal" id="foodModal">

  <div class="modal-content">

    <h2 id="modalTitle">
      Add Food
    </h2>
    <label>Food Name</label>

    <input
      type="text"
      id="foodName"
      placeholder="Enter food name"
    >
    <label>Food Price</label>

    <input
      type="number"
      id="foodPrice"
      placeholder="Enter food price"
    >
    <div class="modal-buttons">

      <button id="saveBtn">
        Save Food
      </button>

      <button id="closeBtn">
        Cancel
      </button>

    </div>

  </div>

</div>
<script src="list.js"></script>

</body>
</html>
